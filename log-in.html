<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hay Go - Sign In or Register</title>

    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Load Remix Icon Library -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">

    <style>
        /* Custom Colors based on Hay Go theme */
        :root {
            --primary-blue: #1F7A8C;
            /* Deep Ocean Blue */
            --accent-lime: #A9F044;
            /* Electric Lime Green */
            --dark-text: #2C3E50;
            /* Navy Dark Text */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            /* Light background */
        }

        /* Custom Button Styling */
        .btn-primary {
            background-color: var(--primary-blue);
            color: white;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(31, 122, 140, 0.4);
        }

        .btn-primary:hover {
            background-color: #1a6a77;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(31, 122, 140, 0.5);
        }

        /* Input Field Focus Style */
        .form-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(31, 122, 140, 0.2);
            outline: none;
        }

        /* Tab Styles */
        .auth-tab {
            color: #718096;
            /* Gray text */
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }

        .auth-tab.active {
            color: var(--dark-text);
            border-bottom: 2px solid var(--primary-blue);
            font-weight: 700;
        }

        /* Hide content initially */
        .auth-content {
            display: none;
        }

        .auth-content.active {
            display: block;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div
        class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden transform transition-all duration-300 relative">

        <!-- Close Button (New addition) -->
        <button onclick="window.location.href='index.php'"
            class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 focus:outline-none">
            <i class="ri-close-line text-2xl"></i>
            
        </button>

        <!-- Header/Branding -->
        <div class="p-6 text-center" style="background-color: var(--primary-blue); color: white;">
            <h1 class="text-3xl font-extrabold tracking-tight">
                Hay Go <span style="color: var(--accent-lime);">Rental</span>
            </h1>
            <p class="text-sm font-light mt-1 opacity-90">Your journey starts here.</p>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex border-b border-gray-200 text-sm md:text-base">
            <div id="tab-signin" class="auth-tab flex-1 py-4 text-center active" onclick="setAuthMode('signin')">
                <i class="ri-login-box-line mr-2"></i>Sign In
            </div>
            <div id="tab-signup" class="auth-tab flex-1 py-4 text-center" onclick="setAuthMode('signup')">
                <i class="ri-user-add-line mr-2"></i>Sign Up
            </div>
        </div>

        <!-- Content Area -->
        <div class="p-8">

            <!-- 1. Sign In Form -->
            <div id="content-signin" class="auth-content active">
                <h2 class="text-2xl font-bold mb-6 text-center" style="color: var(--dark-text);">Welcome Back!</h2>

                <form id="signInForm" class="space-y-6">
                    <div>
                        <label for="signin-email" class="block text-sm font-medium text-gray-700 mb-1">Email
                            Address</label>
                        <input type="email" id="signin-email" required placeholder="your.email@example.com"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>

                    <div>
                        <label for="signin-password"
                            class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" id="signin-password" required placeholder="••••••••"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>

                    <div class="text-right">
                        <a href="#" class="text-sm font-medium hover:underline" style="color: var(--primary-blue);"
                            onclick="event.preventDefault(); setAuthMode('forgot')">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 rounded-full font-bold text-lg">
                        Sign In <i class="ri-arrow-right-line ml-2"></i>
                    </button>
                </form>
            </div>

            <!-- 2. Sign Up Form -->
            <div id="content-signup" class="auth-content">
                <h2 class="text-2xl font-bold mb-6 text-center" style="color: var(--dark-text);">Create Your Account
                </h2>

                <form id="signUpForm" class="space-y-6">
                    <div>
                        <label for="signup-name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input type="text" id="signup-name" required placeholder="Juan Dela Cruz"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>
                    <div>
                        <label for="signup-email" class="block text-sm font-medium text-gray-700 mb-1">Email
                            Address</label>
                        <input type="email" id="signup-email" required placeholder="your.email@example.com"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>
                    <div>
                        <label for="signup-password" class="block text-sm font-medium text-gray-700 mb-1">Choose
                            Password</label>
                        <input type="password" id="signup-password" required placeholder="Minimum 6 characters"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 rounded-full font-bold text-lg">
                        Sign Up <i class="ri-user-add-line ml-2"></i>
                    </button>

                    <div class="text-center text-sm text-gray-500 mt-4">
                        Already have an account? <a href="#" class="font-medium hover:underline"
                            style="color: var(--primary-blue);"
                            onclick="event.preventDefault(); setAuthMode('signin')">Sign In</a>
                    </div>
                </form>
            </div>

            <!-- 3. Forgot Password Form (Direct Password Change) -->
            <div id="content-forgot" class="auth-content">
                <h2 class="text-2xl font-bold mb-6 text-center" style="color: var(--dark-text);">Reset Password</h2>
                <p class="text-sm text-gray-500 mb-6 text-center">
                    Enter your username and a new password to reset your account.
                </p>

                <form id="forgotForm" class="space-y-6">
                    <div>
                        <label for="forgot-username" class="block text-sm font-medium text-gray-700 mb-1">Username /
                            Account ID</label>
                        <input type="text" id="forgot-username" required placeholder="e.g., haygo_user123"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>

                    <div>
                        <label for="forgot-password" class="block text-sm font-medium text-gray-700 mb-1">New
                            Password</label>
                        <input type="password" id="forgot-password" required placeholder="Enter new strong password"
                            class="form-input w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 rounded-full font-bold text-lg">
                        Reset Password <i class="ri-lock-line ml-2"></i>
                    </button>

                    <div class="text-center text-sm text-gray-500 mt-4">
                        <a href="#" class="font-medium hover:underline" style="color: var(--primary-blue);"
                            onclick="event.preventDefault(); setAuthMode('signin')">Back to Sign In</a>
                    </div>
                </form>
            </div>

            <!-- Global Message Area -->
            <div id="messageArea" class="mt-6 p-3 rounded-lg text-sm hidden"></div>

        </div>
    </div>


    <script>
        const tabSignIn = document.getElementById('tab-signin');
        const tabSignUp = document.getElementById('tab-signup');
        const contentSignIn = document.getElementById('content-signin');
        const contentSignUp = document.getElementById('content-signup');
        const contentForgot = document.getElementById('content-forgot');
        const messageArea = document.getElementById('messageArea');

        /**
         * Toggles the active authentication form (Sign In, Sign Up, Forgot Password).
         * @param {string} mode - 'signin', 'signup', or 'forgot'
         */
        function setAuthMode(mode) {
            // 1. Reset all tabs/contents
            [tabSignIn, tabSignUp].forEach(tab => tab.classList.remove('active'));
            [contentSignIn, contentSignUp, contentForgot].forEach(content => content.classList.remove('active'));
            messageArea.classList.add('hidden');

            // 2. Activate the selected mode
            if (mode === 'signin') {
                tabSignIn.classList.add('active');
                contentSignIn.classList.add('active');
            } else if (mode === 'signup') {
                tabSignUp.classList.add('active');
            } else if (mode === 'forgot') {
                // Keep Sign In tab active to suggest returning
                tabSignIn.classList.add('active');
            }
            // For both signup and forgot, the content is hidden by default, so we activate based on ID
            document.getElementById(`content-${mode}`).classList.add('active');
        }

        /**
         * Displays a temporary message in the dedicated message area.
         * @param {string} message 
         * @param {string} type - 'success', 'error', 'info'
         */
        function displayMessage(message, type) {
            messageArea.textContent = message;
            messageArea.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');

            if (type === 'success') {
                messageArea.classList.add('bg-green-100', 'text-green-700');
            } else if (type === 'error') {
                messageArea.classList.add('bg-red-100', 'text-red-700');
            } else { // info
                messageArea.classList.add('bg-blue-100', 'text-blue-700');
            }
        }

        // --- Mock Form Submission Handlers ---

        document.getElementById('signInForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            displayMessage(`Signing in user: ${email}... (Simulated Success!)`, 'success');
        });

        document.getElementById('signUpForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            displayMessage(`Registering new user: ${email}... (Simulated Success!)`, 'success');
        });

        document.getElementById('forgotForm').addEventListener('submit', function (e) {
            e.preventDefault();
            // Updated to grab the new field IDs: forgot-username and forgot-password
            const username = document.getElementById('forgot-username').value;
            const newPassword = document.getElementById('forgot-password').value;

            // Check for simple client-side validation
            if (!username || newPassword.length < 6) {
                displayMessage(`Error: Please enter a username and a password of at least 6 characters.`, 'error');
                return;
            }

            // Simulated Success Message
            displayMessage(`Password for user '${username}' has been updated. (Simulated Success!)`, 'success');
        });

        // Set initial mode on load
        setAuthMode('signin');
    </script>
</body>

</html>
